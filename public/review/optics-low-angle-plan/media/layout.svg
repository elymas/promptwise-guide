<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d"><title id="t">두 테이블과 로우앵글 이동 경로의 평면도</title><desc id="d">앞 테이블은 왼쪽, 뒤 테이블과 인물은 오른쪽. 카메라는 높이82cm로 앞 테이블 오른쪽 빈 통로를 대각선으로 지나간다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d5ed9e"/></marker></defs><rect width="900" height="600" fill="#172019"/><rect x="326" y="329.6" width="78" height="78" fill="#725134" stroke="#c5ad83" stroke-width="2"/><rect x="433.25" y="135.25" width="123.5" height="84.5" fill="#a08c6f" stroke="#d5c5a5" stroke-width="2"/><circle cx="391" cy="379" r="8" fill="#d0854d"/><circle cx="495" cy="103.4" r="15" fill="#9baaa5"/><path d="M430 535L514.5 340" stroke="#d5ed9e" stroke-width="5" marker-end="url(#arrow)"/><circle cx="430" cy="535" r="9" fill="#d5ed9e"/><circle cx="514.5" cy="340" r="9" fill="#d5ed9e"/><g fill="#edf1e4" font-family="sans-serif" font-size="20"><text x="155" y="352">앞 테이블60×60cm</text><text x="150" y="389">오브제 높이14cm</text><text x="590" y="170">뒤 테이블95×65cm</text><text x="530" y="98">앉은 인물 대역</text><text x="245" y="564">카메라 시작</text><text x="542" y="350">카메라 도착</text><text x="540" y="435">오른쪽65cm + 전진150cm</text><text x="540" y="468">높이82cm 유지 · 줌 없음</text></g><path d="M660 220V330M650 220H670M650 330H670" stroke="#b8c9a2" stroke-width="2"/><text x="685" y="282" font-size="18" fill="#b8c9a2">통로84.5cm</text><text x="75" y="40" font-family="sans-serif" font-size="16" fill="#b8c9a2">G1 평면 배치 · 실제 생성 결과나 광학 실측값이 아님</text></svg>