<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">수정안의 평면 배치</title><desc id="desc">카메라 앞1.82미터의 보통 컵과2.43미터의 앉은 인물, 폭85 깊이60센티미터 테이블.</desc><rect width="900" height="470" fill="#172019"/><g stroke="#adc58a" fill="none" stroke-width="2"><path d="M140 235L730 235" stroke-dasharray="7 6"/><rect x="470" y="150" width="120" height="170" rx="3"/><path d="M140 235L504 279M140 235L626 189" opacity=".45"/><path d="M470 135H590M450 150V320"/></g><rect x="105" y="214" width="48" height="42" rx="5" fill="#d5ed9e"/><circle cx="504" cy="279" r="8" fill="#ddd4b7"/><circle cx="626" cy="189" r="15" fill="#91a9ad"/><g fill="#edf1e4" font-family="sans-serif" font-size="19"><text x="80" y="285">카메라</text><text x="476" y="356">보통 컵</text><text x="605" y="145">앉은 인물</text><text x="468" y="115">깊이 60cm</text><text x="340" y="225">폭 85cm</text><text x="225" y="320">카메라 → 컵 약 1.8m</text><text x="225" y="135">카메라 → 인물 약 2.4m</text><text x="90" y="435" font-size="15" fill="#b8c6af">기존 영상 실측이 아닌 수정안의 배치 수치 · 컵/인물은 테이블의 같은 공간에 놓임</text></g></svg>